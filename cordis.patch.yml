# dsh-search-picture —— 随包分发的 profile patch（dsh.bundle 机制自动应用）
#
# 由 `dsh plugin --profile <name> add <本包绝对路径>` 自动注册：
# 包 manifest 的 dsh.bundle.patch 指向本文件，安装后本包加入 profile 的
# dsh.profile.bundles 层，本 patch 即作为该层生效，无需手动编辑 profile 的
# cordis.patch.yml。安装后重启 DSH 即可。
#
# 手动兜底（不使用 dsh plugin 时，把下面两行加到 profile 的 cordis.patch.yml）：
#   - insert:
#       - id: dsh-search-picture
#         name: dsh-search-picture
- insert:
    - id: dsh-search-picture
      name: dsh-search-picture
      # 这里只写「与代码默认值不同」的键：patch 会替换整份 config，把默认值再抄一遍
      # 只会让默认值变得难以维护（曾经就因为抄了旧的 minPixels: 720000 而让
      # 「保底 720p」的门槛失效）。
      # 代码默认：officialSite false、minPixels 921600、minLongEdge 1000、
      # maxAspectRatio 2.6、minBytes 4096、concurrency 6、safebooru true。
      config:
        directory: downloads
        count: 6
